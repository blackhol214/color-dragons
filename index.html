<style>

  #stick { position:fixed; left:24px; bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.35); border:2px solid rgba(255,255,255,.7); display:none; touch-action:none; }

  #camStick .knob { position:absolute; left:35px; top:35px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.9); }
  #camStick span { position:absolute; left:0; right:0; bottom:-18px; text-align:center; font:700 11px system-ui; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); pointer-events:none; }
  #fpBtn { position:fixed; left:24px; bottom:calc(150px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:50%; border:2px solid rgba(255,255,255,.7); background:rgba(22,48,31,.82); font-size:24px; display:none; touch-action:manipulation; }
  #fpBtn.on { background:rgba(176,120,0,.9); }
  /* Los avisos salen en el CENTRO de la pantalla (más fácil de leer) */
  #toast { position:fixed; left:50%; top:42%; transform:translate(-50%, -50%) scale(.96); z-index:24; margin:0; padding:14px 22px; border-radius:16px; background:rgba(22,48,31,.9); color:#fff;
    font:700 20px/1.35 system-ui, sans-serif; text-align:center; white-space:normal; width:max-content; max-width:min(560px, calc(100% - 32px)); box-shadow:0 8px 24px rgba(0,0,0,.3);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }

  #cross::before, #cross::after { content:""; position:absolute; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.5); }

  /* 📦 Esconderse: el aviso "Pulsa B", el botón del celular y la vista desde adentro de la caja (todo oscuro menos una rendija) */

  #contador { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:12; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 18px; border-radius:14px; background:rgba(12,14,16,.78); color:#f1ece0; font:700 18px system-ui, sans-serif; pointer-events:none; white-space:nowrap; }
  #contador b { font:400 13px/1 "ADLaM Display", Impact, sans-serif; letter-spacing:.12em; color:#b9b0d8; }
  #intro { position:fixed; inset:0; z-index:26; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:10px; padding:0 16px calc(28px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent 50%, rgba(0,0,0,.7)); }
  #intro .intro-caja { display:flex; align-items:center; gap:16px; width:min(900px, 100%); box-sizing:border-box; padding:16px 20px; border-radius:16px; background:rgba(8,8,10,.86); border:2px solid #2c2a33; }
  #intro svg { width:72px; height:72px; flex:none; }
  #intro p { margin:0; color:#ece6d6; font:600 clamp(20px, 3.4vw, 30px)/1.45 "Courier New", ui-monospace, monospace; min-height:2.9em; }
  #intro small { color:#9c95ad; font:600 12px system-ui, sans-serif; }
  #cartelNoche { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); z-index:27; margin:0; padding:18px 28px; border-radius:18px; background:rgba(10,10,14,.85); color:#f1ece0; font:400 clamp(26px, 6vw, 54px)/1.15 "ADLaM Display", Impact, sans-serif; text-align:center; pointer-events:none; }
  /* 🎈 El cartel final: ESCAPASTE con letras de colores, estilo marcador */
  #escapaste { position:fixed; left:50%; top:42%; transform:translate(-50%,-50%) rotate(-4deg); z-index:28; margin:0; font:400 clamp(48px, 13vw, 140px)/1 "Permanent Marker", "Comic Sans MS", cursive; letter-spacing:.02em; white-space:nowrap; pointer-events:none; text-shadow:0 6px 0 rgba(0,0,0,.45); }
  #escapaste span:nth-child(6n+1) { color:#e85d75; } #escapaste span:nth-child(6n+2) { color:#e8c75d; } #escapaste span:nth-child(6n+3) { color:#5da8e8; }
  #escapaste span:nth-child(6n+4) { color:#7ad37a; } #escapaste span:nth-child(6n+5) { color:#b17ae8; } #escapaste span:nth-child(6n) { color:#e8935d; }
  #escapaste span { display:inline-block; animation:salta .9s ease-in-out infinite alternate; } #escapaste span:nth-child(even) { animation-delay:.3s; }
  @keyframes salta { to { transform:translateY(-12px) rotate(4deg); } }
  #aviso { position:fixed; left:50%; top:62%; transform:translateX(-50%); margin:0; padding:8px 14px; border-radius:8px; background:rgba(20,22,24,.85); color:#fff; font:600 15px system-ui, sans-serif; pointer-events:none; white-space:nowrap; z-index:12; }
  kbd { font:700 12px ui-monospace, Menlo, monospace; background:#fff; color:#16301f; border-radius:4px; padding:0 5px; }
  #usarBtn { position:fixed; right:16px; bottom:calc(320px + env(safe-area-inset-bottom,0px)); z-index:15; display:none; border:2px solid rgba(255,255,255,.75); border-radius:14px; padding:10px 14px; font:700 15px/1.1 system-ui, sans-serif; color:#fff; background:rgba(22,48,31,.85); touch-action:manipulation; }
  #cajaBtn { position:fixed; right:16px; bottom:calc(270px + env(safe-area-inset-bottom,0px)); z-index:15; display:none; border:2px solid rgba(255,255,255,.75); border-radius:14px; padding:10px 14px; font:700 15px/1.1 system-ui, sans-serif; color:#fff; background:rgba(122,92,58,.92); touch-action:manipulation; }
  #dentroCaja { position:fixed; inset:0; z-index:10; pointer-events:none; overflow:hidden; }
  #dentroCaja .rendija { position:absolute; left:50%; top:46%; width:min(62vw, 560px); height:clamp(56px, 11vh, 96px); transform:translate(-50%, -50%); border-radius:999px;
    box-shadow:0 0 0 200vmax rgba(52,37,22,.96), inset 0 0 24px 10px rgba(30,20,10,.85); }
  #dentroCaja small { position:absolute; left:50%; top:calc(24px + env(safe-area-inset-top,0px)); transform:translateX(-50%); color:#e8d9c2; font:700 15px system-ui, sans-serif; white-space:nowrap; }
  @media (pointer:coarse) { #stick, #jump, #camStick, #fpBtn, #guiaBtn { display:block; } #cajaBtn:not([hidden]), #usarBtn:not([hidden]) { display:block; } #saveBtn { left:16px; right:auto; bottom:calc(220px + env(safe-area-inset-bottom,0px)); padding:10px 16px; font-size:18px; }
    #toast { font-size:17px; } }
  /* 🤖 Bot guía: su globo de diálogo (abajo al centro; en el celular, arriba para no tapar los botones) */
  #guia { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:25; width:min(460px, calc(100% - 32px)); box-sizing:border-box; padding:14px 16px 12px; border-radius:16px; background:#fbfaf5; color:#16301f; border:3px solid #16301f; box-shadow:0 6px 0 #16301f, 0 12px 26px rgba(0,0,0,.3); font:15px/1.45 system-ui, sans-serif; }
  #guia .guia-quien { margin:0 0 4px; font:800 13px system-ui, sans-serif; color:#1f8a3b; letter-spacing:.03em; }
  #guia .guia-texto { margin:0 0 10px; }
  #guia .guia-botones { display:flex; flex-wrap:wrap; gap:8px; }
  #guia button { border:0; border-radius:10px; padding:9px 12px; font:700 14px system-ui, sans-serif; color:#fff; background:#2fae4e; cursor:pointer; touch-action:manipulation; }
  #guia button.otro { background:#5b3df5; }
  #guia button.chico { background:#e6e9e4; color:#16301f; }
  #guia button.elegido { box-shadow:inset 0 0 0 3px #ffd60a; }
  #guia button:focus-visible { outline:3px solid #1e6bff; outline-offset:2px; }
  #guiaCerrar { position:absolute; right:8px; top:8px; width:28px; height:28px; padding:0 !important; }
  @media (pointer:coarse) { #guia { bottom:auto; top:calc(150px + env(safe-area-inset-top,0px)); font-size:14px; } }
</style>

<body>

<canvas id="game"></canvas>
<p id="toast" aria-live="polite"></p>
<div id="cross"></div>
<div id="login">
  <form id="loginForm" class="login-card" autocomplete="off">
    <h1>COLOR DRAGONS</h1>
    <label for="loginName">Tu usuario</label>
    <input id="loginName" type="text" maxlength="24" placeholder="el humano" spellcheck="false">
    <p>Si ya guardaste con este usuario, sigues donde lo dejaste. Para guardar, pulsa el botón verde <b>GUARDAR</b>.</p>
    <p id="loginError" hidden>Escribe un nombre de usuario para jugar.</p>
    <button type="submit">Jugar</button>
  </form>
</div>
<p id="saved" aria-live="polite">CAMBIOS GUARDADOS</p>
<div id="guia" hidden role="dialog" aria-labelledby="guiaQuien">
  <button type="button" id="guiaCerrar" class="chico" aria-label="Cerrar el diálogo del bot guía">×</button>
  <p class="guia-quien" id="guiaQuien">🤖 BOT GUÍA</p>
  <p class="guia-texto" id="guiaTexto" aria-live="polite"></p>
  <div class="guia-botones">
    <button type="button" id="guiaComo">¿Cómo juego?</button>
    <button type="button" id="guiaQue" class="otro">¿Qué tengo que hacer?</button>
    <button type="button" id="guiaColor" class="chico" aria-label="Cambiar el color del bot guía">🎨 Color</button>
  </div>
</div>
<button type="button" id="saveBtn">GUARDAR</button>
<button type="button" id="guiaBtn">🤖 Guía</button>
<button type="button" id="cajaBtn" hidden>📦 Caja</button>
<button type="button" id="usarBtn" hidden>✋ Usar</button>
<p id="aviso" hidden></p>
<div id="contador" hidden><b id="contadorNoche">NOCHE 1</b><span id="contadorTexto"></span></div>
<div id="intro" hidden><div class="intro-caja"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="8" width="32" height="34" rx="3" fill="#0a0a0c"/><rect x="16" y="32" width="32" height="5" fill="#2a2a30"/><ellipse cx="32" cy="44" rx="28" ry="6" fill="#0a0a0c"/></svg><p id="introTexto"></p></div></div>
<p id="cartelNoche" hidden></p>
<p id="escapaste" hidden><span>E</span><span>S</span><span>C</span><span>A</span><span>P</span><span>A</span><span>S</span><span>T</span><span>E</span></p>

<p id="lockHint" hidden>Haz clic para mirar con el ratón (Esc para soltarlo)</p>
<div id="stick"><div id="knob"></div></div>
<div id="camStick" aria-label="Mover la cámara"><div class="knob"></div><span>CÁMARA</span></div>
<button id="jump" type="button">SALTAR</button>
<button id="fpBtn" type="button" aria-label="Cambiar a primera persona">👁️</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { moveAndCollide, squashStretch, rumboDeMovimiento, saveKey, serializeSave, parseSave, GUIA_COMO, textoQueHago, GUIA_COLORES, siguienteColorGuia } from './src/logic.js?v=8';
import { PUERTO, leerSala, ENVIOS_POR_SEGUNDO, nuevoSuavizador, agregarMuestra, valoresEn, corto, acercarAngulo, piezasExplosion } from './src/red.js?v=8';
import { SALAS, ESCOTILLAS, ESCONDITES, SPAWN, LOBBY_SPAWN, FIESTA_SPAWN, ALTO, ALTO_SUBSUELO, altoDe, puertaDe, PISO_PRINCIPAL, PISO_SUBSUELO, tramosDePared, salaEn, escotillaEn, esconditeCerca } from './src/laboratorio.js?v=8';
import { DRAGONES, MODOS, PLATO, nuevosDragones, tickDragones } from './src/dragones.js?v=8';
import { crearDragon, animarDragon } from './src/criaturas.js?v=8';
import { NOCHES, OBJETOS, MAQUINA, MESA_LINTERNAS, INTRO_SEGUNDOS, FIN_SEGUNDOS, nocheDe, nuevaNoche, NOCHE_FINAL, PISTA_SEGUNDOS, entregados, llevaDe, objetoCerca, recoger, entregar, soltar, cercaDeMaquina, tickNoche, siguienteNoche } from './src/noches.js?v=8';
import * as F from './src/fiesta.js?v=8';   // cambiar ?v= al cambiar estos archivos: así el navegador nunca usa una copia vieja
(() => {
  // iPhone ignora user-scalable=no: aquí se bloquea el zoom con dos dedos y el doble toque
  for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 350 && e.target.tagName !== 'INPUT') e.preventDefault(); lastTouchEnd = now; }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  const IS_TOUCH = matchMedia('(pointer:coarse)').matches;
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.5 : 2));   // en el celular, menos píxeles extra (igual se ve nítido)
  // (Sin sombras del sol: el laboratorio tiene techo. Debajo de cada personaje va una sombrita redonda)

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111416);
  scene.fog = new THREE.Fog(0x111416, 18, 62);   // lo de lejos se pierde en la oscuridad

  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 900);
  scene.add(camera);

  // Luces: una luz suave en todos lados y un foco en cada sala grande (las lámparas del techo)
  const luzCielo = new THREE.HemisphereLight(0xc9d2d6, 0x2a2622, 0.55), luzAmbiente = new THREE.AmbientLight(0xffffff, 0.12);
  scene.add(luzCielo, luzAmbiente);

  // ---------- 🧪 El laboratorio (diseño de Mathias: el plano está en src/laboratorio.js) ----------
  const platforms = [];        // todo lo sólido (paredes, pisos, techos, muebles): la física choca con esto
  const bloqueanCamara = [];   // lo que la cámara no puede atravesar (si una pared queda en medio, se acerca)
  const T = 0.3;               // grosor de las paredes
  // Texturas hechas con canvas (sin archivos)
  function lienzo(w, h, dibujar) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    dibujar(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  const manchitas = (g, w, h, n, color) => { g.fillStyle = color; for (let i = 0; i < n; i++) g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2); };
  // Pared: clara arriba, una franja más oscura abajo (el zócalo) y una rayita entre las dos. El color de cada sala la tiñe
  const texPared = lienzo(64, 256, (g, w, h) => {
    g.fillStyle = '#e6e6e2'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#a3a5a1'; g.fillRect(0, h * 0.75, w, h * 0.25);
    g.fillStyle = '#6f716d'; g.fillRect(0, h * 0.75 - 3, w, 3);
    manchitas(g, w, h, 160, 'rgba(0,0,0,.06)');
  });
  // Baldosas del piso (cada una de 1 m): grises con su junta
  const texBaldosa = lienzo(128, 128, (g, w) => {
    g.fillStyle = '#d4d4cf'; g.fillRect(0, 0, w, w);
    manchitas(g, w, w, 300, 'rgba(0,0,0,.07)');
    g.strokeStyle = '#8f908b'; g.lineWidth = 3;
    for (const p of [0, 64, 128]) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, w); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
  });
  texBaldosa.wrapS = texBaldosa.wrapT = THREE.RepeatWrapping;
  // Techo: paneles cuadrados
  const texTecho = lienzo(64, 64, (g, w) => { g.fillStyle = '#4a4e51'; g.fillRect(0, 0, w, w); g.strokeStyle = '#33363a'; g.lineWidth = 3; g.strokeRect(0, 0, w, w); });
  texTecho.wrapS = texTecho.wrapT = THREE.RepeatWrapping;
  // Franjas de peligro (amarillo apagado y negro) para los bordes de las escotillas

  const bonk = () => showToast('💥 ¡BONK!', true, 1200);
  function reiniciarFinal(quien = 'Grey') { showToast(`🐉 ¡${quien} te atrapó! Vuelves al inicio de la fiesta`, true, 3000); empezarFinal(true); }
  // Cada cuadro de la noche final
  function updateFiesta(dt) {
    if (!fiesta) return false;
    const f = fiesta; f.tiempo += dt;
    // Animaciones de las cosas que se mueven
    mallasGlobos.forEach((g, i) => { const k = f.globos[i]; if (k.tocado > 0) k.tocado -= dt; g.userData.bola.position.y = 2.3 + Math.sin(t * 1.5 + i) * 0.08 + Math.max(0, k.tocado - 2) * Math.sin(t * 30) * 0.15; });
    if (cayendo >= 0) { cayendo += dt; globoQueCae.position.y = Math.max(1.4, 5.5 - cayendo * cayendo * 6); if (cayendo > 1.2) { cayendo = -1; F.ruido(f, F.SOMBRERO_FIESTA.x, F.SOMBRERO_FIESTA.z); } }
    // La compuerta: sube cuando cae el globo, y baja (se cierra) cuando entras al cuarto de las cajas
    if (f.fase !== 'intro' && f.fase !== 'fiesta') compuerta.position.y = compuertaCerrada ? Math.max(4.5, compuerta.position.y - dt * 6) : Math.min(7.6, compuerta.position.y + dt * 2);
    // La escotilla cae rápido (como si la empujaran desde abajo) y queda de rampa
    if (bajandoRampa >= 0) { bajandoRampa = Math.min(1, bajandoRampa + dt / 0.45); tapaBisagra.rotation.z = -bajandoRampa * Math.atan2(3, EF.x1 - EF.x0); }
    if (['choque', 'hat', 'fin'].includes(f.fase)) puertaSalida.position.y = Math.max(1.4, puertaSalida.position.y - dt * 8);
    f.cajas.forEach((b, i) => { mallasCajas[i].m.position.set(b.x, 3 + F.CAJA_FIESTA / 2, b.z); mallasCajas[i].p.x = b.x; mallasCajas[i].p.z = b.z; });
    // Grey
    const g = f.grey, cg = greyFiesta;
    cg.obj.position.set(g.x, 0, g.z); cg.obj.rotation.y = acercarAngulo(cg.obj.rotation.y, g.rot, Math.min(1, dt * 10));
    cg.durmiendo = g.modo === 'dormir';
    animarDragon(cg, dt, { vel: g.vel, persigue: g.modo === 'perseguir', mirar: g.modo === 'perseguir' ? miraA.set(ps.pos.x, ps.pos.y + 1, ps.pos.z) : null });
    if (g.modo === 'dormir') cg.abajo.rotation.x = 0;
    // Las etapas
    if (f.fase === 'intro') {
      introEl.hidden = false; introTexto.textContent = F.MENSAJE_INICIO.slice(0, Math.floor(f.tiempo * 9));
      const u = Math.min(1, f.tiempo / F.DURACION.intro);
      camera.position.copy(camaraFinal.getPointAt(u)); camera.lookAt(camaraFinal.getPointAt(Math.min(1, u + 0.04), _mira));
      if (f.tiempo >= F.DURACION.intro) { f.fase = 'fiesta'; f.tiempo = 0; introEl.hidden = true; }
      return true;   // (la cámara la manejamos aquí)
    }
    if (['fiesta', 'bloques', 'escape'].includes(f.fase)) {
      const i = F.globoTocado(f, ps.pos);
      if (i >= 0) { f.globos[i].tocado = 3; F.ruido(f, F.GLOBOS[i].x, F.GLOBOS[i].z); }   // (el globo tiembla: se nota sin letrero)
      if (F.tickGrey(f, dt, { x: ps.pos.x, y: ps.pos.y, z: ps.pos.z, oculto: oculto() }) === 'atrapado') { reiniciarFinal(); return false; }
    }
    if (f.fase === 'fiesta' && F.enElDescanso(ps.pos)) {
      f.fase = 'bloques'; cayendo = 0;
      solidoCompuerta.top = -1000; solidoCompuerta.bottom = -1001;
      showToast('📦 ¡Se abrió la compuerta! Entra y saca las cajas de encima de la escotilla', false, 4000);
    }
    // Al entrar al cuarto de las cajas, la compuerta se cierra detrás de ti
    if (f.fase === 'bloques' && !compuertaCerrada && F.enCuartoCajas(ps.pos)) {
      compuertaCerrada = true; solidoCompuerta.top = 6; solidoCompuerta.bottom = 3;
      showToast(`🚪 ¡La puerta se cerró detrás de ti! Quedan ${F.cajasQueTapan(f)} cajas encima de la escotilla`, true, 3500);
    }
    if (f.fase === 'bloques') empujarCajas(dt);
    if (f.fase === 'bloques' && F.escotillaLibre(f)) {
      // ¡Grey abre la escotilla desde abajo! Cae rápido como rampa, y Grey sube a perseguirte
      f.fase = 'escape'; bajandoRampa = 0;
      solidoTapa.top = -1000; solidoTapa.bottom = -1001;
      for (const e of escalonesBajada) platforms.push(e);
      g.x = F.ENTRA_GREY.x; g.z = F.ENTRA_GREY.z; g.modo = 'perseguir'; g.ruta = null;
      showToast('💥 ¡Grey abrió la escotilla! ¡Baja, sal al pasillo y corre por las ventilaciones!', true, 4000);
    }
    if (f.fase === 'escape' && F.afuera(ps.pos)) {
      f.fase = 'choque'; f.tiempo = 0;
      solidoSalida.top = 2.8; solidoSalida.bottom = 0;
      g.x = 234; g.z = 46; g.modo = 'cutscene';
    }
    if (f.fase === 'choque') {
      // 🎬 Grey corre contra la puerta cerrada, se estrella y se devuelve
      const k = f.tiempo;
      if (k < 1.3) { g.z = 46 + k * 5.5; g.vel = 11; g.rot = 0; }
      else if (k < 1.4) { if (!f.bonk) { f.bonk = true; bonk(); } g.vel = 0; }
      else { g.z = Math.max(46, 53.15 - (k - 1.4) * 3); g.rot = Math.PI; g.vel = 3; }
      puertaSalida.position.x = 234 + (k > 1.3 && k < 1.8 ? Math.sin(k * 80) * 0.08 : 0);
      camera.position.set(239, 6, 62); camera.lookAt(234, 1.5, 51);
      if (k >= F.DURACION.choque) { f.fase = 'hat'; f.tiempo = 0; hat.g.visible = true; greyFiesta.obj.visible = false; }
      return true;
    }
    if (f.fase === 'hat') {
      // 🎩 Hat aparece completo y habla
      introEl.hidden = false; introTexto.textContent = F.MENSAJE_FINAL.slice(0, Math.floor(f.tiempo * 9));
      hat.g.position.y = Math.sin(t * 1.5) * 0.06; hat.plumas.rotation.y = Math.sin(t * 1.2) * 0.3;
      hat.pup.position.x = -0.85 + Math.sin(t * 0.8) * 0.12;
      camera.position.set(181, 3.4, 4.3); camera.lookAt(181, 2.6, -3);
      if (f.tiempo >= F.DURACION.hat) { f.fase = 'fin'; f.tiempo = 0; introEl.hidden = true; escapasteEl.hidden = false; }
      return true;
    }
    if (f.fase === 'fin') {
      camera.position.set(181, 3.4, 4.3); camera.lookAt(181, 2.6, -3);
      if (f.tiempo >= F.DURACION.fin) { guardarProgreso(1); irAlLobby(); }   // (después de escapar, la historia vuelve a empezar)
      return true;
    }
    return false;
  }
  // 📦 Empujar: si caminas contra una caja, se mueve en esa dirección (más lento que tú)
  let empujeX = 0, empujeZ = 0;
  function empujarCajas(dt) {
    if (Math.hypot(empujeX, empujeZ) < 0.1 || ps.pos.y < 2.5) return;
    fiesta.cajas.forEach((b, i) => {
      const dx = b.x - ps.pos.x, dz = b.z - ps.pos.z, lim = F.CAJA_FIESTA / 2 + PR + 0.15;
      if (Math.abs(dx) > lim || Math.abs(dz) > lim) return;
      const enX = Math.abs(dx) > Math.abs(dz), dir = enX ? Math.sign(dx) : Math.sign(dz), quiere = enX ? empujeX : empujeZ;
      if (Math.sign(quiere) !== dir || Math.abs(quiere) < 0.3) return;
      F.empujar(fiesta, i, enX ? dir * 3.2 * dt : 0, enX ? 0 : dir * 3.2 * dt);
    });
  }
  // ✨ Si tardas mucho buscando, los objetos que faltan muestran un contorno blanco (se ve a través de las paredes)
  function contornos(on) {
    mallasObjetos.forEach((m, i) => {
      if (on && !m.userData.contorno) {
        const c = m.userData.giro.clone(true);
        c.traverse(o => { if (o.isMesh) { o.material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, depthTest: false, side: THREE.BackSide }); o.renderOrder = 999; } });
        c.scale.setScalar(1.25); m.userData.contorno = c; m.userData.giro.add(c); c.position.set(0, 0, 0); c.rotation.set(0, 0, 0);
      }
      if (m.userData.contorno) m.userData.contorno.visible = on && noche && noche.objetos[i] && noche.objetos[i].estado === 'suelto';
    });
  }

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  let t = 0;
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    t += dt;

    let fx = 0, fz = 0;
    if (keys.KeyW || keys.ArrowUp) fz -= 1;
    if (keys.KeyS || keys.ArrowDown) fz += 1;
    if (keys.KeyA) fx -= 1;
    if (keys.KeyD) fx += 1;
    // Flechas izquierda/derecha giran la cámara (más rápido que con el ratón)
    const CAM_TURN = 3;
    if (keys.ArrowLeft) camYaw += CAM_TURN * dt;
    if (keys.ArrowRight) camYaw -= CAM_TURN * dt;
    fx += joy.x; fz += joy.y;
    // Joystick de la cámara (celular): a los lados gira, arriba y abajo mira hacia arriba o abajo
    if (camJoy.x || camJoy.y) {
      camYaw -= camJoy.x * 2.6 * dt;
      if (firstPerson) fpPitch = Math.min(1.3, Math.max(-1.3, fpPitch - camJoy.y * 1.6 * dt));
      else camPitch = Math.min(1.2, Math.max(0.1, camPitch + camJoy.y * 1.2 * dt));
    }
    const busy = !loginEl.hidden || !!escondido || !!(fiesta && ['intro', 'choque', 'hat', 'fin'].includes(fiesta.fase)) || !!(noche && noche.fase === 'intro');
    if (busy) fx = fz = 0; // eligiendo usuario (o metido en el armario) no te mueves
    const len = Math.hypot(fx, fz);
    let moving = false;
    empujeX = empujeZ = 0;
    if (len > 0.1) {
      moving = true;
      const n = Math.min(len, 1) / len;
      fx *= n; fz *= n;
      // relativo a la cámara
      const s = Math.sin(camYaw), c = Math.cos(camYaw);
      const mx = fx * c + fz * s, mz = -fx * s + fz * c;
      const rapidez = enCaja ? VEL_CAJA : SPEED;   // con la caja puesta vas más lento
      empujeX = mx; empujeZ = mz;   // (para empujar los bloques de la noche final)
      ps.walkX += mx * rapidez * dt;
      ps.walkZ += mz * rapidez * dt;
      turnTo(ps, mx, mz, dt);
    }

    // 🪜 En una escotilla: W o ESPACIO suben por la escalera, S baja. Si no tocas nada, resbalas despacito hacia abajo
    const esc = !oculto() && escotillaEn(ps.pos.x, ps.pos.y, ps.pos.z);
    if (esc) {
      const sube = keys.KeyW || keys.ArrowUp || keys.Space || joy.y < -0.5, baja = keys.KeyS || keys.ArrowDown || joy.y > 0.5;
      if (sube || baja) {
        ps.vel.y = sube ? 5.5 : -5.5;
        // Colgado de la escalera no caminas hacia los lados (si no, W te sacaría de la escalera en vez de subirte).
        // Arriba del todo sí: así te bajas caminando al piso
        if (!ps.onGround && ps.pos.y < PISO_PRINCIPAL + 0.45) ps.walkX = ps.walkZ = 0;
        // Mientras trepas, te acomoda en el centro del hoyo (para no chocar la cabeza con el borde)
        const k = Math.min(1, dt * 5);
        ps.pos.x += ((esc.x0 + esc.x1) / 2 - ps.pos.x) * k; ps.pos.z += ((esc.z0 + esc.z1) / 2 - ps.pos.z) * k;
      } else ps.vel.y = Math.max(ps.vel.y, -6);
    }
    if (!escondido) physics(ps, dt, keys.Space && !busy && !esc && !enCaja);   // (con la caja puesta no se salta)
    if (esc && ps.pos.y > PISO_PRINCIPAL + 0.5) { ps.pos.y = PISO_PRINCIPAL + 0.5; ps.vel.y = 0; }   // arriba de todo: te bajas caminando
    if (ps.pos.y < PISO_SUBSUELO - 15) { ps.pos.set(spawn.x, spawn.y, spawn.z); ps.vel.set(0, 0, 0); showToast('Te caíste del laboratorio: vuelves al spawn', true); }
    bendState(ps, dt);
    updateGuia(dt);
    updateRed(dt);
    updateEscondites(dt);
    moverCaja(miCaja, enCaja, moving, dt, t);
    updateDragones(dt);
    updateNoches(dt);
    const fiestaCamara = updateFiesta(dt);
    revisarPuertaLobby();
    updatePuertas(dt, [ps.pos, ...[...red.otros.values()].map(f => f.obj.position), ...[...cuerposDragon.values()].map(c => c.obj.position)]);

    // pequeño rebote al caminar
    body.position.y = H/2 + (moving && ps.onGround && !enCaja ? Math.abs(Math.sin(t * 12)) * 0.08 : 0);
    // La sombrita redonda debajo de ti (más chica mientras más alto saltas)
    const alturaSombra = ps.pos.y - (ps.floorY ?? ps.pos.y);
    sombra.visible = !escondido && ps.floorY > -1e8 && alturaSombra < 8;
    sombra.position.set(ps.pos.x, (ps.floorY ?? 0) + 0.02, ps.pos.z); sombra.scale.setScalar(Math.max(0.4, 1 - alturaSombra * 0.08));

    const p = player.position;
    if (fiestaCamara) {
      // 🎬 (las cutscenes de la noche final manejan la cámara)
    } else if (camaraIntro()) {
      // 🎥 (la intro de la noche maneja la cámara)
    } else if (escondido) {
      // 📦 Dentro de la caja: miras desde adentro (por la rendija), y puedes girar para ver quién viene
      const ey = escondido.y + 0.95;
      camera.position.set(escondido.x, ey, escondido.z);
      camera.lookAt(escondido.x - Math.sin(camYaw) * Math.cos(fpPitch), ey + Math.sin(fpPitch), escondido.z - Math.cos(camYaw) * Math.cos(fpPitch));
    } else if (firstPerson) {
      // Primera persona: la cámara va en los ojos y mira hacia donde apunta la cámara
      const ey = p.y + body.position.y - H/2 + H*0.78;
      camera.position.set(p.x, ey, p.z);
      camera.lookAt(
        p.x - Math.sin(camYaw) * Math.cos(fpPitch),
        ey + Math.sin(fpPitch),
        p.z - Math.cos(camYaw) * Math.cos(fpPitch)
      );
    } else {
      // Cámara en tercera persona
      const head = new THREE.Vector3(p.x, p.y + 1.2, p.z);
      const back = new THREE.Vector3(Math.sin(camYaw) * Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw) * Math.cos(camPitch));
      // Si una pared (o el techo) queda en medio, la cámara se acerca enseguida; cuando ya no, se aleja suavemente
      camRay.set(head, back); camRay.far = 9;
      const choque = camRay.intersectObjects(bloqueanCamara, false)[0];
      const quiere = choque ? Math.max(0.6, choque.distance - 0.3) : 9;
      camDist = quiere < camDist ? quiere : camDist + (quiere - camDist) * Math.min(1, dt * 4);
      camera.position.copy(head).addScaledVector(back, camDist);
      camera.lookAt(head);
      player.visible = camDist > 1.3;   // si la cámara queda pegada a ti, te escondes para no tapar la vista
    }

    // 🔧 (solo con ?debug) cámara libre para revisar cosas: cd.libre = { x, y, z, mx, my, mz }
    if (window.cd && cd.libre) { const L = cd.libre; camera.position.set(L.x, L.y, L.z); camera.lookAt(L.mx, L.my, L.mz); }
    apuntarLinterna();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
