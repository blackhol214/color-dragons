<!doctype html>
<html lang="es">
<head>

<style>
  :root { color-scheme: light; --sky:#bfe3f2; --ink:#16301f; --panel:rgba(255,255,255,.78); --accent:#2fae4e; }
  html, body { height:100%; margin:0; overflow:hidden; background:var(--sky); font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color:var(--ink); }
  [hidden] { display:none !important; }
  /* Pantalla de inicio: pide tu usuario */
  #login { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:16px; background:rgba(10,20,14,.55); backdrop-filter:blur(4px); }
  .login-card { width:min(380px, 100%); display:flex; flex-direction:column; gap:10px; padding:22px; border-radius:14px; background:#fbfaf5; color:#16301f; box-shadow:0 20px 50px rgba(0,0,0,.35); }
  .login-card h1 { margin:0 0 4px; font:400 34px/1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; color:#1f8a3b; letter-spacing:.02em; }
  .login-card label { font:700 13px system-ui, sans-serif; }
  .login-card input { border:2px solid #cfd8d2; border-radius:8px; padding:10px 12px; font:16px system-ui, sans-serif; color:#16301f; background:#fff; }
  .login-card input:focus { outline:none; border-color:#2fae4e; }
  .login-card p { margin:0; font:13px/1.4 system-ui, sans-serif; color:#4a5f52; }
  .login-card button { border:0; border-radius:8px; padding:12px; font:700 16px system-ui, sans-serif; background:#2fae4e; color:#fff; cursor:pointer; }
  .login-card button:focus-visible { outline:3px solid #1e6bff; outline-offset:2px; }
  #loginError { color:#c0141a; font-weight:600; }
  /* Aviso de guardado */
  #saved { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%) scale(.7); margin:0; z-index:25; font:400 clamp(34px, 8vw, 84px)/1.1 "ADLaM Display", Impact, "Arial Narrow Bold", sans-serif; color:#2fd158; text-shadow:0 4px 0 #0d5a22, 0 8px 18px rgba(0,0,0,.35); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  #saved.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #game { position:fixed; inset:0; display:block; width:100%; height:100%; touch-action:none; }
  /* Celular: que tocar dos veces rápido (o con dos dedos) no haga zoom en la pantalla */
  html, body { touch-action:manipulation; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-text-size-adjust:100%; }
  input { -webkit-user-select:text; user-select:text; }
  #stick { position:fixed; left:24px; bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.35); border:2px solid rgba(255,255,255,.7); display:none; touch-action:none; }
  #knob { position:absolute; left:35px; top:35px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.9); }
  #jump { position:fixed; right:150px; bottom:calc(34px + env(safe-area-inset-bottom,0px)); width:80px; height:80px; border-radius:50%; border:2px solid rgba(255,255,255,.7); background:rgba(47,174,78,.75); color:#fff; font:700 14px system-ui; display:none; touch-action:none; }
  /* Celular: joystick de la cámara (a la derecha) y botón de primera persona */
  #camStick { position:fixed; right:24px; bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.25); border:2px dashed rgba(255,255,255,.7); display:none; touch-action:none; }
  #camStick .knob { position:absolute; left:35px; top:35px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.9); }
  #camStick span { position:absolute; left:0; right:0; bottom:-18px; text-align:center; font:700 11px system-ui; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); pointer-events:none; }
  #fpBtn { position:fixed; left:24px; bottom:calc(150px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:50%; border:2px solid rgba(255,255,255,.7); background:rgba(22,48,31,.82); font-size:24px; display:none; touch-action:manipulation; }
  #fpBtn.on { background:rgba(176,120,0,.9); }
  /* Los avisos salen en el CENTRO de la pantalla (más fácil de leer) */
  #toast { position:fixed; left:50%; top:42%; transform:translate(-50%, -50%) scale(.96); z-index:24; margin:0; padding:14px 22px; border-radius:16px; background:rgba(22,48,31,.9); color:#fff;
    font:700 20px/1.35 system-ui, sans-serif; text-align:center; white-space:normal; width:max-content; max-width:min(560px, calc(100% - 32px)); box-shadow:0 8px 24px rgba(0,0,0,.3);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  #toast.show { opacity:1; transform:translate(-50%, -50%) scale(1); }
  #toast.bad { background:rgba(150,20,20,.9); }
  #cross { position:fixed; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; pointer-events:none; display:none; }
  #cross::before, #cross::after { content:""; position:absolute; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.5); }
  #cross::before { left:10px; top:0; width:2px; height:22px; }
  #cross::after { top:10px; left:0; height:2px; width:22px; }
  #lockHint { position:fixed; left:50%; top:58%; transform:translateX(-50%); margin:0; padding:8px 14px; border-radius:8px; background:rgba(22,48,31,.85); color:#fff; font:600 14px system-ui, sans-serif; pointer-events:none; }
  /* Botón GUARDAR (esquina de abajo a la derecha) */
  #saveBtn { position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:15; border:0; border-radius:12px; padding:12px 22px; font:400 22px/1 "ADLaM Display", Impact, "Arial Narrow Bold", sans-serif; letter-spacing:.04em; color:#fff; background:#1f8a3b; box-shadow:0 4px 0 #0d5a22, 0 8px 18px rgba(0,0,0,.3); cursor:pointer; }
  #saveBtn:hover { background:#24a046; }
  #saveBtn:active { transform:translateY(3px); box-shadow:0 1px 0 #0d5a22, 0 4px 10px rgba(0,0,0,.3); }
  #saveBtn:focus-visible { outline:3px solid #1e6bff; outline-offset:3px; }
  @media (prefers-reduced-motion: reduce) { #toast, #saved { transition:none; } }
  /* Botón del bot guía para el celular (no hay teclado) */
  #guiaBtn { position:fixed; right:16px; bottom:calc(220px + env(safe-area-inset-bottom,0px)); z-index:15; display:none; min-width:64px; border:2px solid rgba(255,255,255,.75); border-radius:14px; padding:8px 12px; font:700 14px/1.1 system-ui, sans-serif; color:#fff; background:rgba(22,48,31,.82); touch-action:manipulation; }
  /* 📦 Esconderse: el aviso "Pulsa B", el botón del celular y la vista desde adentro de la caja (todo oscuro menos una rendija) */
  #aviso { position:fixed; left:50%; top:62%; transform:translateX(-50%); margin:0; padding:8px 14px; border-radius:8px; background:rgba(20,22,24,.85); color:#fff; font:600 15px system-ui, sans-serif; pointer-events:none; white-space:nowrap; z-index:12; }
  kbd { font:700 12px ui-monospace, Menlo, monospace; background:#fff; color:#16301f; border-radius:4px; padding:0 5px; }
  #cajaBtn { position:fixed; right:16px; bottom:calc(270px + env(safe-area-inset-bottom,0px)); z-index:15; display:none; border:2px solid rgba(255,255,255,.75); border-radius:14px; padding:10px 14px; font:700 15px/1.1 system-ui, sans-serif; color:#fff; background:rgba(122,92,58,.92); touch-action:manipulation; }
  #dentroCaja { position:fixed; inset:0; z-index:10; pointer-events:none; overflow:hidden; }
  #dentroCaja .rendija { position:absolute; left:50%; top:46%; width:min(62vw, 560px); height:clamp(56px, 11vh, 96px); transform:translate(-50%, -50%); border-radius:999px;
    box-shadow:0 0 0 200vmax rgba(52,37,22,.96), inset 0 0 24px 10px rgba(30,20,10,.85); }
  #dentroCaja small { position:absolute; left:50%; top:calc(24px + env(safe-area-inset-top,0px)); transform:translateX(-50%); color:#e8d9c2; font:700 15px system-ui, sans-serif; white-space:nowrap; }
  @media (pointer:coarse) { #stick, #jump, #camStick, #fpBtn, #guiaBtn { display:block; } #cajaBtn:not([hidden]) { display:block; } #saveBtn { left:16px; right:auto; bottom:calc(220px + env(safe-area-inset-bottom,0px)); padding:10px 16px; font-size:18px; }
    #toast { font-size:17px; } }
  /* 🤖 Bot guía: su globo de diálogo (abajo al centro; en el celular, arriba para no tapar los botones) */
  #guia { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:25; width:min(460px, calc(100% - 32px)); box-sizing:border-box; padding:14px 16px 12px; border-radius:16px; background:#fbfaf5; color:#16301f; border:3px solid #16301f; box-shadow:0 6px 0 #16301f, 0 12px 26px rgba(0,0,0,.3); font:15px/1.45 system-ui, sans-serif; }
  #guia .guia-quien { margin:0 0 4px; font:800 13px system-ui, sans-serif; color:#1f8a3b; letter-spacing:.03em; }
  #guia .guia-texto { margin:0 0 10px; }
  #guia .guia-botones { display:flex; flex-wrap:wrap; gap:8px; }
  #guia button { border:0; border-radius:10px; padding:9px 12px; font:700 14px system-ui, sans-serif; color:#fff; background:#2fae4e; cursor:pointer; touch-action:manipulation; }
  #guia button.otro { background:#5b3df5; }
  #guia button.chico { background:#e6e9e4; color:#16301f; }
  #guia button.elegido { box-shadow:inset 0 0 0 3px #ffd60a; }
  #guia button:focus-visible { outline:3px solid #1e6bff; outline-offset:2px; }
  #guiaCerrar { position:absolute; right:8px; top:8px; width:28px; height:28px; padding:0 !important; }
  @media (pointer:coarse) { #guia { bottom:auto; top:calc(150px + env(safe-area-inset-top,0px)); font-size:14px; } }
</style>
</head>
<body>

<canvas id="game"></canvas>
<p id="toast" aria-live="polite"></p>
<div id="cross"></div>
<div id="login">
  <form id="loginForm" class="login-card" autocomplete="off">
    <h1>COLOR DRAGONS</h1>
    <label for="loginName">Tu usuario</label>
    <input id="loginName" type="text" maxlength="24" placeholder="el humano" spellcheck="false">
    <p>Si ya guardaste con este usuario, sigues donde lo dejaste. Para guardar, pulsa el botón verde <b>GUARDAR</b>.</p>
    <p id="loginError" hidden>Escribe un nombre de usuario para jugar.</p>
    <button type="submit">Jugar</button>
  </form>
</div>
<p id="saved" aria-live="polite">CAMBIOS GUARDADOS</p>
<div id="guia" hidden role="dialog" aria-labelledby="guiaQuien">
  <button type="button" id="guiaCerrar" class="chico" aria-label="Cerrar el diálogo del bot guía">×</button>
  <p class="guia-quien" id="guiaQuien">🤖 BOT GUÍA</p>
  <p class="guia-texto" id="guiaTexto" aria-live="polite"></p>
  <div class="guia-botones">
    <button type="button" id="guiaComo">¿Cómo juego?</button>
    <button type="button" id="guiaQue" class="otro">¿Qué tengo que hacer?</button>
    <button type="button" id="guiaColor" class="chico" aria-label="Cambiar el color del bot guía">🎨 Color</button>
  </div>
</div>
<button type="button" id="saveBtn">GUARDAR</button>
<button type="button" id="guiaBtn">🤖 Guía</button>
<button type="button" id="cajaBtn" hidden>📦 Esconderse</button>
<p id="aviso" hidden></p>
<div id="dentroCaja" hidden><div class="rendija"></div><small></small></div>
<p id="lockHint" hidden>Haz clic para mirar con el ratón (Esc para soltarlo)</p>
<div id="stick"><div id="knob"></div></div>
<div id="camStick" aria-label="Mover la cámara"><div class="knob"></div><span>CÁMARA</span></div>
<button id="jump" type="button">SALTAR</button>
<button id="fpBtn" type="button" aria-label="Cambiar a primera persona">👁️</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { moveAndCollide, squashStretch, rumboDeMovimiento, saveKey, serializeSave, parseSave, GUIA_COMO, textoQueHago, GUIA_COLORES, siguienteColorGuia } from './src/logic.js?v=2';
import { PUERTO, leerSala, ENVIOS_POR_SEGUNDO, nuevoSuavizador, agregarMuestra, valoresEn, corto, acercarAngulo, piezasExplosion } from './src/red.js?v=2';
import { SALAS, ESCOTILLAS, ESCONDITES, SPAWN, ALTO, ALTO_PUERTA, PISO_PRINCIPAL, PISO_SUBSUELO, tramosDePared, salaEn, escotillaEn, esconditeCerca } from './src/laboratorio.js?v=2';   // cambiar ?v= al cambiar estos archivos: así el navegador nunca usa una copia vieja
(() => {
  // iPhone ignora user-scalable=no: aquí se bloquea el zoom con dos dedos y el doble toque
  for (const ev of ['gesturestart', 'gesturechange']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastTouchEnd < 350 && e.target.tagName !== 'INPUT') e.preventDefault(); lastTouchEnd = now; }, { passive: false });
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  const IS_TOUCH = matchMedia('(pointer:coarse)').matches;
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.5 : 2));   // en el celular, menos píxeles extra (igual se ve nítido)
  // (Sin sombras del sol: el laboratorio tiene techo. Debajo de cada personaje va una sombrita redonda)

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111416);
  scene.fog = new THREE.Fog(0x111416, 18, 62);   // lo de lejos se pierde en la oscuridad

  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 900);
  scene.add(camera);

  // Luces: una luz suave en todos lados y un foco en cada sala grande (las lámparas del techo)
  scene.add(new THREE.HemisphereLight(0xc9d2d6, 0x2a2622, 0.55));
  scene.add(new THREE.AmbientLight(0xffffff, 0.12));

  // ---------- 🧪 El laboratorio (diseño de Mathias: el plano está en src/laboratorio.js) ----------
  const platforms = [];        // todo lo sólido (paredes, pisos, techos, muebles): la física choca con esto
  const bloqueanCamara = [];   // lo que la cámara no puede atravesar (si una pared queda en medio, se acerca)
  const T = 0.3;               // grosor de las paredes
  // Texturas hechas con canvas (sin archivos)
  function lienzo(w, h, dibujar) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    dibujar(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  const manchitas = (g, w, h, n, color) => { g.fillStyle = color; for (let i = 0; i < n; i++) g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2); };
  // Pared: clara arriba, una franja más oscura abajo (el zócalo) y una rayita entre las dos. El color de cada sala la tiñe
  const texPared = lienzo(64, 256, (g, w, h) => {
    g.fillStyle = '#e6e6e2'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#a3a5a1'; g.fillRect(0, h * 0.75, w, h * 0.25);
    g.fillStyle = '#6f716d'; g.fillRect(0, h * 0.75 - 3, w, 3);
    manchitas(g, w, h, 160, 'rgba(0,0,0,.06)');
  });
  // Baldosas del piso (cada una de 1 m): grises con su junta
  const texBaldosa = lienzo(128, 128, (g, w) => {
    g.fillStyle = '#d4d4cf'; g.fillRect(0, 0, w, w);
    manchitas(g, w, w, 300, 'rgba(0,0,0,.07)');
    g.strokeStyle = '#8f908b'; g.lineWidth = 3;
    for (const p of [0, 64, 128]) { g.beginPath(); g.moveTo(p, 0); g.lineTo(p, w); g.stroke(); g.beginPath(); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
  });
  texBaldosa.wrapS = texBaldosa.wrapT = THREE.RepeatWrapping;
  // Techo: paneles cuadrados
  const texTecho = lienzo(64, 64, (g, w) => { g.fillStyle = '#4a4e51'; g.fillRect(0, 0, w, w); g.strokeStyle = '#33363a'; g.lineWidth = 3; g.strokeRect(0, 0, w, w); });
  texTecho.wrapS = texTecho.wrapT = THREE.RepeatWrapping;
  // Franjas de peligro (amarillo apagado y negro) para los bordes de las escotillas
  const texPeligro = lienzo(64, 16, (g, w, h) => {
    g.fillStyle = '#a8924a'; g.fillRect(0, 0, w, h); g.fillStyle = '#2b2b2b';
    for (let x = -16; x < w; x += 16) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + 8, h); g.lineTo(x + 16, 0); g.lineTo(x + 8, 0); g.fill(); }
  });
  texPeligro.wrapS = THREE.RepeatWrapping;

  const mats = new Map();
  const lambert = (color, extra = {}) => {
    const k = color + JSON.stringify(Object.keys(extra)) + (extra.map ? extra.map.uuid : '');
    if (!mats.has(k)) mats.set(k, new THREE.MeshLambertMaterial({ color, ...extra }));
    return mats.get(k);
  };
  const METAL = lambert(0x6d7378), METAL_OSCURO = lambert(0x3c4145), BLANCO_SUCIO = lambert(0xc4c5bf), MESON = lambert(0xa9aca8);
  const VIDRIO = new THREE.MeshLambertMaterial({ color: 0xa9c3c4, transparent: true, opacity: 0.22, depthWrite: false });

  // Una caja (mueble, pared…). solido: la física choca con ella · camara: la cámara no la atraviesa
  function bloque(x0, x1, y0, y1, z0, z1, mat, { solido = true, camara = false } = {}) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    scene.add(m);
    if (solido) platforms.push({ x: (x0 + x1) / 2, z: (z0 + z1) / 2, hw: (x1 - x0) / 2, hd: (z1 - z0) / 2, top: y1, bottom: y0 });
    if (camara) bloqueanCamara.push(m);
    return m;
  }
  // Un rectángulo plano (piso o techo) con la textura pegada al mundo: así las baldosas siempre miden 1 m
  function plano(x0, x1, z0, z1, y, mat, haciaAbajo = false, escala = 0.5) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([x0, y, z0, x1, y, z0, x1, y, z1, x0, y, z1], 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute([x0, z0, x1, z0, x1, z1, x0, z1].map(n => n * escala), 2));
    g.setIndex(haciaAbajo ? [0, 1, 2, 0, 2, 3] : [0, 2, 1, 0, 3, 2]);
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat);
    scene.add(m); bloqueanCamara.push(m);
    return m;
  }
  // Un rectángulo menos los hoyos (las escotillas): quedan hasta 4 pedazos alrededor de cada hoyo
  function restarHoyos(r, hoyos) {
    let piezas = [r];
    for (const h of hoyos) {
      const nuevas = [];
      for (const p of piezas) {
        if (h.x0 >= p.x1 || h.x1 <= p.x0 || h.z0 >= p.z1 || h.z1 <= p.z0) { nuevas.push(p); continue; }
        if (h.z0 > p.z0) nuevas.push({ x0: p.x0, x1: p.x1, z0: p.z0, z1: h.z0 });
        if (h.z1 < p.z1) nuevas.push({ x0: p.x0, x1: p.x1, z0: h.z1, z1: p.z1 });
        const z0 = Math.max(p.z0, h.z0), z1 = Math.min(p.z1, h.z1);
        if (h.x0 > p.x0) nuevas.push({ x0: p.x0, x1: h.x0, z0, z1 });
        if (h.x1 < p.x1) nuevas.push({ x0: h.x1, x1: p.x1, z0, z1 });
      }
      piezas = nuevas;
    }
    return piezas;
  }
  const lucesTecho = [];
  // Una sala: piso, techo con lámparas, 4 paredes con sus puertas (y el marco oscuro de cada puerta)
  function construirSala(s) {
    const { x0, x1, z0, z1, y } = s, arriba = y + ALTO, tunel = s.id.startsWith('tunel');
    const matPared = lambert(s.pared, { map: texPared }), matPiso = lambert(s.piso, { map: texBaldosa }), MARCO = METAL_OSCURO;
    // Piso (con el hoyo de la escotilla si la hay) y techo (con el hoyo si una escotilla baja hasta aquí)
    for (const r of restarHoyos(s, ESCOTILLAS.filter(e => e.desde === s.id))) {
      plano(r.x0, r.x1, r.z0, r.z1, y, matPiso);
      platforms.push({ x: (r.x0 + r.x1) / 2, z: (r.z0 + r.z1) / 2, hw: (r.x1 - r.x0) / 2, hd: (r.z1 - r.z0) / 2, top: y, bottom: y - 0.3 });
    }
    for (const r of restarHoyos(s, ESCOTILLAS.filter(e => e.hacia === s.id))) {
      plano(r.x0, r.x1, r.z0, r.z1, arriba, lambert(0xffffff, { map: texTecho }), true);
      platforms.push({ x: (r.x0 + r.x1) / 2, z: (r.z0 + r.z1) / 2, hw: (r.x1 - r.x0) / 2, hd: (r.z1 - r.z0) / 2, top: arriba + 0.3, bottom: arriba });
    }
    // Lámparas del techo: tubos que brillan (una cada ~7 m; en los túneles, amarillentas y más separadas)
    const nx = Math.max(1, Math.round((x1 - x0) / 7)), nz = Math.max(1, Math.round((z1 - z0) / 7));
    const lampara = new THREE.MeshBasicMaterial({ color: y < 0 ? 0xbdb38f : 0xcfd9d4 });
    for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
      const lx = x0 + (x1 - x0) * (i + 0.5) / nx, lz = z0 + (z1 - z0) * (j + 0.5) / nz;
      if (ESCOTILLAS.some(e => lx > e.x0 - 1 && lx < e.x1 + 1 && lz > e.z0 - 1 && lz < e.z1 + 1)) continue;   // (no encima del hoyo)
      const largo = (x1 - x0) >= (z1 - z0);
      bloque(lx - (largo ? 0.8 : 0.18), lx + (largo ? 0.8 : 0.18), arriba - 0.08, arriba, lz - (largo ? 0.18 : 0.8), lz + (largo ? 0.18 : 0.8), lampara, { solido: false });
      lucesTecho.push({ x: lx, y: arriba - 0.3, z: lz, sala: s.id });
    }
    // Paredes: cada lado se parte en tramos alrededor de las puertas
    const lados = [
      { lado: 'n', desde: x0, hasta: x1, caja: (a, b, ya, yb) => bloque(a, b, ya, yb, z0, z0 + T, ya === y ? matPared : MARCO, { camara: true }) },
      { lado: 's', desde: x0, hasta: x1, caja: (a, b, ya, yb) => bloque(a, b, ya, yb, z1 - T, z1, ya === y ? matPared : MARCO, { camara: true }) },
      { lado: 'w', desde: z0, hasta: z1, caja: (a, b, ya, yb) => bloque(x0, x0 + T, ya, yb, a, b, ya === y ? matPared : MARCO, { camara: true }) },
      { lado: 'e', desde: z0, hasta: z1, caja: (a, b, ya, yb) => bloque(x1 - T, x1, ya, yb, a, b, ya === y ? matPared : MARCO, { camara: true }) },
    ];
    for (const L of lados) {
      const puertas = s.puertas[L.lado] || [];
      for (const [a, b] of tramosDePared(L.desde, L.hasta, puertas)) L.caja(a, b, y, arriba);
      // Encima de cada puerta, el dintel (menos en las uniones de pasillo, que quedan abiertas hasta el techo)
      for (const [a, b] of puertas) if (b - a < L.hasta - L.desde - 0.01 && !tunel) L.caja(a, b, y + ALTO_PUERTA, arriba);
    }
  }
  for (const s of SALAS) construirSala(s);

  // Focos de luz (pocos, para que el juego vaya fluido): uno en cada sala grande. El de Grey's Cove parpadea
  const focos = {};
  for (const [id, color, k] of [['spawn', 0xe8eee8, 1], ['testLab', 0xd6ece6, 1], ['salon', 0xe6e8ee, 1.1], ['centerLab', 0xe2eaf0, 1.2], ['banos', 0xeef0e6, 0.9],
    ['lockers', 0xe0eadb, 0.9], ['panico', 0xf0d6cf, 0.8], ['greyCove', 0xc9ccd0, 0.9], ['yellowRoom', 0xf0e0a8, 0.9], ['tunelCentro', 0xd8d0b0, 0.6]]) {
    const s = SALAS.find(q => q.id === id);
    const luz = new THREE.PointLight(color, k, 26, 1.3);
    luz.position.set((s.x0 + s.x1) / 2, s.y + ALTO - 0.6, (s.z0 + s.z1) / 2);
    scene.add(luz); focos[id] = luz;
  }

  // ---------- Las escotillas: un hoyo con borde de peligro, la tapa abierta y una escalera de mano hasta el subsuelo ----------
  for (const e of ESCOTILLAS) {
    const cx = (e.x0 + e.x1) / 2, cz = (e.z0 + e.z1) / 2, y0 = PISO_SUBSUELO, techoSub = PISO_SUBSUELO + ALTO;
    const matShaft = lambert(0x55595c, { map: texPared });
    // El tubo de concreto entre el techo del subsuelo y el piso de arriba
    bloque(e.x0 - 0.2, e.x0, techoSub, -0.3, e.z0 - 0.2, e.z1 + 0.2, matShaft, { camara: true });
    bloque(e.x1, e.x1 + 0.2, techoSub, -0.3, e.z0 - 0.2, e.z1 + 0.2, matShaft, { camara: true });
    bloque(e.x0, e.x1, techoSub, -0.3, e.z0 - 0.2, e.z0, matShaft, { camara: true });
    bloque(e.x0, e.x1, techoSub, -0.3, e.z1, e.z1 + 0.2, matShaft, { camara: true });
    // Borde de peligro alrededor del hoyo (amarillo apagado y negro)
    const borde = lambert(0xffffff, { map: texPeligro });
    bloque(e.x0 - 0.25, e.x1 + 0.25, 0, 0.04, e.z0 - 0.25, e.z0, borde, { solido: false });
    bloque(e.x0 - 0.25, e.x1 + 0.25, 0, 0.04, e.z1, e.z1 + 0.25, borde, { solido: false });
    bloque(e.x0 - 0.25, e.x0, 0, 0.04, e.z0, e.z1, borde, { solido: false });
    bloque(e.x1, e.x1 + 0.25, 0, 0.04, e.z0, e.z1, borde, { solido: false });
    // La tapa, abierta y apoyada hacia atrás
    const tapa = new THREE.Mesh(new THREE.BoxGeometry(e.x1 - e.x0, 0.08, e.z1 - e.z0), METAL);
    const bisagra = new THREE.Group(); bisagra.position.set(cx, 0.04, e.z0 - 0.25); bisagra.rotation.x = -1.75;
    tapa.position.z = (e.z1 - e.z0) / 2; bisagra.add(tapa); scene.add(bisagra);
    for (const dx of [-0.6, 0, 0.6]) { const r = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, (e.z1 - e.z0) * 0.8), METAL_OSCURO); r.position.set(dx, 0.08, (e.z1 - e.z0) / 2); bisagra.add(r); }
    // La escalera de mano, pegada al lado oeste (aGrey) o este (aYellow) del hoyo
    const lx = e.id === 'aGrey' ? e.x0 + 0.12 : e.x1 - 0.12, rieles = lambert(0x8d7f52);
    for (const dz of [-0.4, 0.4]) bloque(lx - 0.05, lx + 0.05, y0, 0.9, cz + dz - 0.05, cz + dz + 0.05, rieles, { solido: false });
    for (let yy = y0 + 0.3; yy < 0.8; yy += 0.35) bloque(lx - 0.04, lx + 0.04, yy, yy + 0.06, cz - 0.4, cz + 0.4, rieles, { solido: false });
    // Abajo, la escalera va atornillada a una placa de metal
    const px = e.id === 'aGrey' ? e.x0 - 0.15 : e.x1 + 0.15;
    bloque(px - 0.1, px + 0.1, y0, techoSub, cz - 0.7, cz + 0.7, METAL_OSCURO);
  }

  // ---------- Carteles (de los dibujos de Mathias): un dibujo en canvas pegado a una pared o a un poste ----------
  function cartel(w, h, ancho, alto, dibujar) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(ancho, alto), new THREE.MeshLambertMaterial({ map: lienzo(w, h, dibujar), transparent: true }));
    scene.add(m); return m;
  }
  const letras = (g, texto, x, y, tam, color, fuente = 'Impact, "Arial Narrow Bold", sans-serif') => { g.fillStyle = color; g.font = `${tam}px ${fuente}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(texto, x, y); };
  // En una pared: lado = hacia dónde mira el cartel
  const enPared = (m, x, y, z, lado) => { m.position.set(x, y, z); m.rotation.y = { s: 0, n: Math.PI, e: Math.PI / 2, w: -Math.PI / 2 }[lado]; };
  const cintaPeligro = texto => lienzo(512, 64, (g, w, h) => {
    g.fillStyle = '#a8924a'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 128) letras(g, texto, x + 64, h / 2 + 2, 44, '#2b2b2b');
  });

  // ---------- Muebles ----------
  // Mesa de laboratorio: cubierta clara sobre un mueble de metal (sólida: no te puedes meter debajo)
  function mesaLab(cx, cz, y, w, d, cubierta = MESON) {
    bloque(cx - w / 2 + 0.06, cx + w / 2 - 0.06, y, y + 0.86, cz - d / 2 + 0.06, cz + d / 2 - 0.06, METAL);
    bloque(cx - w / 2, cx + w / 2, y + 0.86, y + 0.94, cz - d / 2, cz + d / 2, cubierta, { solido: false });
    platforms[platforms.length - 2].top = y + 0.94;   // (la mesa entera es un solo bloque sólido)
    return y + 0.94;
  }
  // Frascos de colores apagados
  const COLORES_FRASCO = [0x8fa39a, 0xa58f97, 0x9b9a7d, 0x8a97a8, 0x9a8670];
  function frascos(cx, cz, y, n = 3) {
    for (let i = 0; i < n; i++) {
      const r = 0.07 + Math.random() * 0.05, alto = 0.18 + Math.random() * 0.2, col = COLORES_FRASCO[Math.floor(Math.random() * COLORES_FRASCO.length)];
      const f = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 1.2, alto, 10), new THREE.MeshLambertMaterial({ color: col, transparent: true, opacity: 0.8 }));
      f.position.set(cx + (i - (n - 1) / 2) * 0.32, y + alto / 2, cz + (Math.random() - 0.5) * 0.2); scene.add(f);
    }
  }
  // Monitor con la pantalla apagada (un poquito de brillo azul)
  function monitor(cx, cz, y, mira = 's') {
    const g = new THREE.Group();
    const pantalla = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.06), METAL_OSCURO); pantalla.position.y = 0.45; g.add(pantalla);
    const vidrio = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.4), new THREE.MeshBasicMaterial({ color: 0x2e3e42 })); vidrio.position.set(0, 0.45, 0.035); g.add(vidrio);
    const pie = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.08), METAL_OSCURO); pie.position.y = 0.1; g.add(pie);
    g.position.set(cx, y, cz); g.rotation.y = { s: 0, n: Math.PI, e: Math.PI / 2, w: -Math.PI / 2 }[mira]; scene.add(g);
  }
  // Tanque de pruebas: base y tapa de metal, vidrio y un poco de líquido al fondo
  function tanque(cx, cz, y, tinte) {
    bloque(cx - 1.1, cx + 1.1, y, y + 0.3, cz - 1.1, cz + 1.1, METAL_OSCURO, { solido: false });
    bloque(cx - 1, cx + 1, y + 0.3, y + 2.5, cz - 1, cz + 1, VIDRIO, { solido: false });
    bloque(cx - 0.95, cx + 0.95, y + 0.3, y + 0.85, cz - 0.95, cz + 0.95, new THREE.MeshLambertMaterial({ color: tinte, transparent: true, opacity: 0.45, depthWrite: false }), { solido: false });
    bloque(cx - 1.1, cx + 1.1, y + 2.5, y + 2.75, cz - 1.1, cz + 1.1, METAL, { solido: false });
    for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) bloque(cx + dx - 0.06, cx + dx + 0.06, y + 0.3, y + 2.5, cz + dz - 0.06, cz + dz + 0.06, METAL, { solido: false });
    platforms.push({ x: cx, z: cz, hw: 1.1, hd: 1.1, top: y + 2.75, bottom: y });   // (todo el tanque es sólido)
  }
  // Banca
  const banca = (cx, cz, y, w, d) => { bloque(cx - w / 2, cx + w / 2, y + 0.38, y + 0.46, cz - d / 2, cz + d / 2, lambert(0x6e6a62)); bloque(cx - w / 2 + 0.1, cx + w / 2 - 0.1, y, y + 0.38, cz - d / 2 + 0.1, cz + d / 2 - 0.1, METAL_OSCURO, { solido: false }); };
  // Tubos por el techo de los pasillos
  function tubo(x0, x1, z0, z1, y, color = 0x5d6265) {
    const largo = Math.hypot(x1 - x0, z1 - z0), t = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, largo, 8), lambert(color));
    t.position.set((x0 + x1) / 2, y, (z0 + z1) / 2); t.rotation.z = Math.PI / 2; t.rotation.y = -Math.atan2(z1 - z0, x1 - x0); scene.add(t);
  }
  // Lockers: una fila de casilleros de metal (con rejillas y manija)
  const texLocker = lienzo(64, 256, (g, w, h) => {
    g.fillStyle = '#d8dcd6'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#7d827c'; for (let i = 0; i < 5; i++) g.fillRect(14, 22 + i * 10, 36, 4);   // rejillas
    g.fillStyle = '#5b5f5a'; g.fillRect(44, 120, 6, 30);                                   // manija
    g.strokeStyle = '#8b908a'; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);
    manchitas(g, w, h, 80, 'rgba(0,0,0,.08)');
  });
  function filaLockers(x0, z0, n, haciaX, mira, y = 0) {
    const tonos = [0x7f8e80, 0x76867a, 0x83907f];
    for (let i = 0; i < n; i++) {
      const lx = haciaX ? x0 + i * 0.62 : x0, lz = haciaX ? z0 : z0 + i * 0.62;
      const m = bloque(lx - (haciaX ? 0.3 : 0.25), lx + (haciaX ? 0.3 : 0.25), y, y + 2, lz - (haciaX ? 0.25 : 0.3), lz + (haciaX ? 0.25 : 0.3), lambert(tonos[i % 3]));
      const frente = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 1.96), lambert(tonos[i % 3], { map: texLocker }));
      enPared(frente, lx + (mira === 'e' ? 0.26 : mira === 'w' ? -0.26 : 0), y + 1, lz + (mira === 's' ? 0.26 : mira === 'n' ? -0.26 : 0), mira);
      scene.add(frente);
    }
  }

  // ---------- 📦 Las cajas para esconderse (y el armario de Yellow) ----------
  // Cartón: color café apagado, rayitas del corrugado, cinta en el medio, flechas de "este lado arriba" y la manija para agarrarla
  const texCartonLado = lienzo(128, 128, (g, w, h) => {
    g.fillStyle = '#9b7b55'; g.fillRect(0, 0, w, h);
    g.strokeStyle = 'rgba(70,48,25,.12)'; g.lineWidth = 1; for (let x = 2; x < w; x += 5) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    manchitas(g, w, h, 120, 'rgba(60,40,20,.15)');
    g.fillStyle = '#b39f78'; g.fillRect(w / 2 - 10, 0, 20, 26);                                     // la cinta que baja desde arriba
    g.fillStyle = '#2b1f14'; g.beginPath(); g.ellipse(w / 2, 44, 20, 7, 0, 0, Math.PI * 2); g.fill();  // la manija (un hoyo)
    g.strokeStyle = '#4a3420'; g.lineWidth = 3;
    for (const fx of [22, 40]) { g.beginPath(); g.moveTo(fx, 110); g.lineTo(fx, 86); g.moveTo(fx - 6, 93); g.lineTo(fx, 86); g.lineTo(fx + 6, 93); g.stroke(); }   // ↑↑
    g.strokeStyle = 'rgba(40,25,10,.35)'; g.lineWidth = 4; g.strokeRect(0, 0, w, h);               // bordes más oscuros
  });
  const texCartonArriba = lienzo(128, 128, (g, w, h) => {
    g.fillStyle = '#a2835b'; g.fillRect(0, 0, w, h); manchitas(g, w, h, 120, 'rgba(60,40,20,.15)');
    g.fillStyle = '#b39f78'; g.fillRect(w / 2 - 10, 0, 20, h);
    g.strokeStyle = 'rgba(40,25,10,.35)'; g.lineWidth = 4; g.strokeRect(0, 0, w, h);
  });
  const CARTON_LADO = lambert(0xffffff, { map: texCartonLado }), CARTON_ARRIBA = lambert(0xffffff, { map: texCartonArriba });
  const CAJA = { w: 1.3, h: 1.25 };
  function cajaCarton(e) {
    const g = new THREE.Group(), { w, h } = CAJA;
    const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), [CARTON_LADO, CARTON_LADO, CARTON_ARRIBA, CARTON_ARRIBA, CARTON_LADO, CARTON_LADO]);
    cuerpo.position.y = h / 2; g.add(cuerpo);
    // Las 4 solapas de arriba, un poco abiertas (al esconderte se cierran)
    const solapas = [];
    for (const [ang, largo] of [[0, w / 2], [Math.PI / 2, w / 2], [Math.PI, w / 2], [-Math.PI / 2, w / 2]]) {
      const giro = new THREE.Group(); giro.rotation.y = ang;
      const bisagra = new THREE.Group(); bisagra.position.set(0, h, w / 2); giro.add(bisagra);
      const solapa = new THREE.Mesh(new THREE.BoxGeometry(w * (ang % Math.PI === 0 ? 1 : 0.98), 0.025, largo), CARTON_ARRIBA);
      solapa.position.z = -largo / 2; bisagra.add(solapa);
      bisagra.rotation.x = -0.55 - Math.random() * 0.25;
      bisagra.userData.abierta = bisagra.rotation.x;
      g.add(giro); solapas.push(bisagra);
    }
    g.position.set(e.x, e.y, e.z); g.rotation.y = (Math.random() - 0.5) * 0.5; scene.add(g);
    platforms.push({ x: e.x, z: e.z, hw: w / 2, hd: w / 2, top: e.y + h, bottom: e.y });
    return { obj: g, solapas };
  }
  function armario(e) {
    const g = new THREE.Group(), mat = lambert(0x8a8f86);
    const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.3, 0.9), mat); cuerpo.position.y = 1.15; g.add(cuerpo);
    const raya = new THREE.Mesh(new THREE.BoxGeometry(0.03, 2.1, 0.02), METAL_OSCURO); raya.position.set(0, 1.15, 0.46); g.add(raya);
    for (const sx of [-1, 1]) {
      const manija = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.3, 0.05), METAL_OSCURO); manija.position.set(sx * 0.12, 1.2, 0.48); g.add(manija);
      for (let i = 0; i < 4; i++) { const r = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.02), METAL_OSCURO); r.position.set(sx * 0.42, 1.9 - i * 0.08, 0.46); g.add(r); }   // rejillas
    }
    g.position.set(e.x, e.y, e.z); scene.add(g);
    platforms.push({ x: e.x, z: e.z, hw: 0.8, hd: 0.45, top: e.y + 2.3, bottom: e.y });
    return { obj: g, solapas: [] };
  }
  const escondites = ESCONDITES.map(e => ({ ...e, ...(e.tipo === 'caja' ? cajaCarton(e) : armario(e)) }));

  // ---------- Lo que hay en cada sala (según los dibujos) ----------
  // 🧪 Test Lab: dos tanques de prueba (uno rosado), mesas con frascos y monitores
  tanque(-28.5, -26.6, 0, 0xa8848f);
  tanque(-21, -26.6, 0, 0x7f9c98);
  frascos(-25, -29.2, mesaLab(-25, -29.2, 0, 4, 1));
  { const y = mesaLab(-20.5, -21.4, 0, 4, 1.2); frascos(-21.5, -21.4, y); monitor(-19.4, -21.6, y, 'n'); }
  monitor(-24.8, -29.4, 0.94, 's');
  // ☀️ Spawn: el sol en el piso (donde apareces) y dos bancas
  {
    const sol = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.MeshLambertMaterial({ transparent: true, map: lienzo(256, 256, (g, w) => {
      g.strokeStyle = '#8c8a80'; g.lineWidth = 8; g.strokeRect(10, 10, w - 20, w - 20);
      g.fillStyle = '#9a8f6c'; g.beginPath();
      for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, r = i % 2 ? 62 : 104; g.lineTo(w / 2 + Math.cos(a) * r, w / 2 + Math.sin(a) * r); }
      g.closePath(); g.fill();
      g.fillStyle = '#b3a882'; g.beginPath(); g.arc(w / 2, w / 2, 50, 0, Math.PI * 2); g.fill();
    }) }));
    sol.rotation.x = -Math.PI / 2; sol.position.set(SPAWN.x, 0.01, SPAWN.z); scene.add(sol);
    banca(-10, -29, 0, 3, 0.8); banca(2, -29, 0, 3, 0.8);
  }
  // 🚽 Baños: 4 cubículos con su puerta entreabierta y su inodoro, y los lavamanos con espejo
  {
    const tabique = lambert(0x9da29c), puerta = lambert(0x8e948e);
    for (let i = 0; i <= 4; i++) bloque(14.9 + i * 2.6, 15.0 + i * 2.6, 0.15, 2.2, -29.7, -27.4, tabique);
    for (let i = 0; i < 4; i++) {
      const sx = 16.25 + i * 2.6;
      const bis = new THREE.Group(); bis.position.set(sx - 1.1, 0.15, -27.4); bis.rotation.y = -0.4 - i * 0.25;
      const p = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.95, 0.05), puerta); p.position.set(1.05, 1, 0); bis.add(p); scene.add(bis);
      bloque(sx - 0.25, sx + 0.25, 0, 0.42, -29.5, -28.8, BLANCO_SUCIO);    // inodoro
      bloque(sx - 0.3, sx + 0.3, 0.42, 1.0, -29.7, -29.45, BLANCO_SUCIO);  // su tanque
    }
    bloque(24.9, 25.7, 0, 0.85, -21, -12, MESON);
    for (const z of [-19.4, -16.5, -13.6]) { bloque(24.95, 25.55, 0.8, 0.88, z - 0.4, z + 0.4, BLANCO_SUCIO, { solido: false }); bloque(25.5, 25.62, 0.88, 1.15, z - 0.03, z + 0.03, METAL, { solido: false }); }
    const espejo = new THREE.Mesh(new THREE.PlaneGeometry(8.6, 1.1), new THREE.MeshLambertMaterial({ color: 0x9aa6aa, emissive: 0x1b2224 }));
    enPared(espejo, 25.68, 1.9, -16.5, 'w'); scene.add(espejo);
  }
  // 🔒 Lockers: filas de casilleros y una banca larga
  filaLockers(20.8, -7.45, 18, true, 's');

    if (cerca) avisoEl.innerHTML = `Pulsa <kbd>B</kbd> para meterte en ${cerca.tipo === 'caja' ? 'la caja' : 'el armario'}`;
    cajaBtn.hidden = !cerca && !escondido;
    cajaBtn.textContent = escondido ? '📦 Salir' : '📦 Esconderse';
    if (escondido) player.visible = false;
  }

  // Avisos en el centro de la pantalla
  const toast = document.getElementById('toast');
  let toastTimer = null;
  function showToast(text, bad = false, ms = 2200) {
    toast.textContent = text; toast.classList.toggle('bad', bad); toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
  }

  // ---------- Usuario y guardado (localStorage) ----------
  const loginEl = document.getElementById('login'), loginForm = document.getElementById('loginForm');
  const loginName = document.getElementById('loginName'), loginError = document.getElementById('loginError');
  const savedEl = document.getElementById('saved');
  let userName = null, savedTimer = null, loadedLocal = false;
  loginName.focus();
  loginForm.addEventListener('submit', e => {
    e.preventDefault();
    const name = loginName.value.trim().replace(/\s+/g, ' ');
    if (!name) { loginError.hidden = false; loginName.focus(); return; }
    userName = name;
    loginEl.hidden = true; loginName.blur();
    const loaded = loadGame(name);
    loadedLocal = loaded;
    showToast(loaded ? `¡Hola de nuevo, ${name}! Seguiste donde guardaste` : `Hola, ${name}. Para guardar, pulsa GUARDAR (abajo a la derecha)`);
    guiaSaludo = `¡Hola, ${name}! Soy tu bot guía 🤖. `; guiaMostrar(true);   // al empezar, el cubito aparece a tu lado (el diálogo se abre con ENTER)
    conectarRed(name);
  });
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.addEventListener('click', () => { saveGame(); saveBtn.blur(); }); // blur: que Espacio siga siendo saltar
  function saveGame() {
    if (!userName) return;
    try {
      localStorage.setItem(saveKey(userName), serializeSave({ pos: ps.pos }));
    } catch (e) {
      showToast('No se pudo guardar: este navegador no deja guardar datos', true);
      return;
    }
    savedEl.classList.add('show');
    clearTimeout(savedTimer); savedTimer = setTimeout(() => savedEl.classList.remove('show'), 2200);
  }
  function loadGame(name) {
    let raw = null;
    try { raw = localStorage.getItem(saveKey(name)); } catch (e) { return false; }
    const data = raw && parseSave(raw);
    if (!data) return false;
    // Si el guardado quedó fuera del mapa, vuelves a donde apareces
    if (data.pos && salaEn(data.pos.x, data.pos.y, data.pos.z)) ps.pos.set(data.pos.x, data.pos.y, data.pos.z);
    return true;
  }

  // ---------- 🤖 Bot guía: un cubito que flota a tu lado y te explica el juego ----------
  // Cada jugador tiene el suyo (solo lo ves tú). ENTER abre o cierra su diálogo · H lo esconde o lo llama · C le cambia el color · × cierra el diálogo
  const guiaEl = document.getElementById('guia'), guiaTexto = document.getElementById('guiaTexto');
  const guiaBot = (() => {
    const g = new THREE.Group(), L = 0.55;
    const cubo = new THREE.Mesh(new THREE.BoxGeometry(L, L, L), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    g.add(cubo);
    for (const ex of [-0.12, 0.12]) { const e = new THREE.Mesh(eyeGeo, eyeMat); e.scale.set(0.6, 0.6, 0.3); e.position.set(ex, 0.07, L / 2 + 0.01); cubo.add(e); }
    const palo = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.22, 6), new THREE.MeshLambertMaterial({ color: 0x333333 }));
    palo.position.y = L / 2 + 0.11; cubo.add(palo);   // la antenita…
    const luz = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff3b3b }));
    luz.position.y = L / 2 + 0.25; cubo.add(luz);     // …con su lucecita (parpadea mientras te habla)
    g.visible = false; scene.add(g);
    return { obj: g, cubo, luz, t: 0 };
  })();
  let guiaVisible = false, guiaColor = 0;
  try { guiaColor = Math.floor(+localStorage.getItem('color-dragons:guia-color')) % GUIA_COLORES.length || 0; } catch (e) {}
  guiaBot.cubo.material.color.setHex(GUIA_COLORES[guiaColor]);
  function guiaCambiarColor() {
    guiaColor = siguienteColorGuia(guiaColor);
    guiaBot.cubo.material.color.setHex(GUIA_COLORES[guiaColor]);
    try { localStorage.setItem('color-dragons:guia-color', guiaColor); } catch (e) {}   // tu color se recuerda en este navegador
  }
  function guiaDecir(boton, antes = '') {
    const sala = salaEn(ps.pos.x, ps.pos.y, ps.pos.z);   // 📍 dónde estás (así no hacen falta carteles que tapen la vista)
    const texto = boton === 'guiaQue' ? (sala ? `📍 Estás en: ${sala.nombre}. ` : '') + textoQueHago('mundo') : GUIA_COMO[IS_TOUCH ? 'touch' : 'teclado'];
    guiaTexto.textContent = antes + texto;
    for (const b of guiaEl.querySelectorAll('button')) b.classList.toggle('elegido', b.id === boton);
  }
  // El cubito: H lo esconde o lo llama (sin abrir el diálogo) · el diálogo SOLO se abre con ENTER (o el botón 🤖 Guía del celular)
  let guiaSaludo = '';   // lo que dice la primera vez que abres el diálogo
  function guiaMostrar(on) {
    if (on && !guiaVisible) guiaBot.t = -1;   // -1: en el próximo cuadro aparece justo a tu lado (no viene volando desde lejos)
    guiaVisible = on; guiaBot.obj.visible = on;
    if (!on) guiaEl.hidden = true;
  }
  function guiaDialogo(on) {
    if (on) { guiaMostrar(true); guiaEl.hidden = false; guiaDecir('guiaComo', guiaSaludo); guiaSaludo = ''; }
    else guiaEl.hidden = true;
  }
  document.getElementById('guiaComo').addEventListener('click', e => { guiaDecir('guiaComo'); e.currentTarget.blur(); });   // blur: que Espacio siga siendo saltar
  document.getElementById('guiaQue').addEventListener('click', e => { guiaDecir('guiaQue'); e.currentTarget.blur(); });
  document.getElementById('guiaColor').addEventListener('click', e => { guiaCambiarColor(); e.currentTarget.blur(); });
  document.getElementById('guiaCerrar').addEventListener('click', () => { guiaEl.hidden = true; });
  const guiaMeta = new THREE.Vector3();
  function updateGuia(dt) {
    if (!guiaVisible) return;
    const b = guiaBot;
    b.t = b.t < 0 ? 0 : b.t + dt;
    // Flota a tu derecha (mirando desde la cámara), un poco más arriba de tu cabeza, subiendo y bajando
    guiaMeta.set(ps.pos.x + Math.cos(camYaw) * 1.3, ps.pos.y + 1.9 + Math.sin(b.t * 2.5) * 0.12, ps.pos.z - Math.sin(camYaw) * 1.3);
    if (b.t === 0 || b.obj.position.distanceTo(guiaMeta) > 25) b.obj.position.copy(guiaMeta);   // recién llamado o te teletransportaste: aparece ahí
    else b.obj.position.lerp(guiaMeta, Math.min(1, dt * 5));                                   // si no, te sigue suave
    b.obj.rotation.y = camYaw + Math.sin(b.t * 1.7) * 0.25;   // te mira (hacia la cámara) y se balancea un poquito
    b.luz.visible = guiaEl.hidden || Math.floor(b.t * 3) % 2 === 0;
  }

  // ---------- Multijugador: tus amigos en tiempo real ----------
  // Cartelito con el nombre encima de la cabeza
  function makeLabel(text, color = '#fff') {
    const c = document.createElement('canvas'); c.width = 256; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 8, 256, 48);
    g.fillStyle = color; g.font = 'bold 34px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 128, 33);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
    s.scale.set(2.4, 0.6, 1); s.position.y = H + 0.6;
    return s;
  }
  // Un amigo: rectángulo de su color con ojos, igual que tú
  function addFriend(j) {
    const obj = new THREE.Group();
    const b = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), new THREE.MeshLambertMaterial({ color: j.color }));
    b.position.y = H/2; b.castShadow = true; obj.add(b);
    [-0.22, 0.22].forEach(x => { const e = new THREE.Mesh(eyeGeo, eyeMat); e.scale.z = 0.5; e.position.set(x, H*0.78, D/2 + 0.02); obj.add(e); });
    obj.add(makeLabel(j.nombre));
    obj.position.set(j.x, j.y, j.z); obj.rotation.y = j.rot || 0; obj.visible = !j.oculto;   // (si está metido en una caja, no se ve)
    scene.add(obj);
    red.otros.set(j.id, { obj, body: b, nombre: j.nombre, suave: nuevoSuavizador() });
  }
  // ¡BOOM! El rectángulo se rompe en pedacitos de su color que salen volando
  const pieceGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
  function explode(f) {
    const p = f.obj.position;
    // Un solo material para los 40 pedacitos (todos se desvanecen igual): menos trabajo para la tarjeta de video
    const mat = f.body.material.clone(); mat.transparent = true;
    const boom = { mat, vida: 1.6, piezas: [] };
    for (const q of piezasExplosion(40)) {
      const m = new THREE.Mesh(pieceGeo, mat);
      m.position.set(p.x, p.y + q.y, p.z);
      scene.add(m);
      boom.piezas.push({ m, ...q });
    }
    red.pedazos.push(boom);
    scene.remove(f.obj);
  }
  function conectarRed(name) {
    if (!ONLINE || red.ws) return;
    const ws = new WebSocket(SERVER_WS);
    red.ws = ws;
    ws.onopen = () => ws.send(JSON.stringify({ tipo: 'hola', nombre: name, color: body.material.color.getHex() }));
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.tipo === 'bienvenida') {
        red.id = m.id;
        for (const j of m.jugadores) addFriend(j);
        // En una compu nueva (sin guardado en el navegador) apareces donde te dejó la base de datos
        if (m.guardado && !loadedLocal && salaEn(m.guardado.x, m.guardado.y, m.guardado.z)) ps.pos.set(m.guardado.x, m.guardado.y, m.guardado.z);
        const n = m.jugadores.length;
        showToast(n ? `¡Conectado! Hay ${n} amigo${n > 1 ? 's' : ''} jugando` : '¡Conectado! Eres el primero en llegar', false, 3000);
      } else if (m.tipo === 'entra') {
        addFriend(m); showToast(`${m.nombre} entró al juego`);
      } else if (m.tipo === 'pos') {
        const f = red.otros.get(m.id);
        if (f) { f.body.material.color.setHex(m.color); f.obj.visible = !m.oculto; agregarMuestra(f.suave, [m.x, m.y, m.z, m.rot], m.t, performance.now()); }
      } else if (m.tipo === 'sale') {
        const f = red.otros.get(m.id);
        if (f) { explode(f); red.otros.delete(m.id); }
        showToast(`💥 ${m.nombre} se desconectó`, true, 3000);
      } else if (m.tipo === 'error') {
        red.error = true;   // (para que al cerrarse no diga "¿el servidor está encendido?")
        showToast(m.texto, true, 5000);
      }
    };
    ws.onclose = () => {
      // Si nunca llegó la bienvenida, la sala no existe o el servidor está apagado
      if (red.id === null) { red.ws = null; if (!red.error) showToast('No se pudo entrar a la sala: ¿el servidor está encendido? Juegas solo', true, 5000); red.error = false; return; }
      for (const f of red.otros.values()) scene.remove(f.obj);
      red.otros.clear(); red.ws = null; red.id = null;
      showToast('Se cortó la conexión con el servidor', true, 4000);
    };
  }
  function updateRed(dt) {
    // Mandar tu posición unas 10 veces por segundo
    if (red.id !== null && (red.envio -= dt) <= 0) {
      red.envio = Math.max(red.envio + 1 / ENVIOS_POR_SEGUNDO, 0);   // sumar (no reemplazar): así salen 10 por segundo de verdad, no 8
      // Si no te moviste, no hace falta repetirlo 10 veces por segundo: basta una vez por segundo (para que el servidor sepa que sigues ahí)
      const pos = { tipo: 'pos', x: corto(ps.pos.x), y: corto(ps.pos.y), z: corto(ps.pos.z), rot: corto(ps.facing), color: body.material.color.getHex(), oculto: escondido ? 1 : 0 };
      const txt = JSON.stringify(pos);
      pos.t = Math.round(performance.now());   // tu hora: los demás la usan para dibujarte suave (va aparte para que "¿te moviste?" no cambie siempre)
      red.quieto = txt === red.ultimaPos ? (red.quieto || 0) + 1 : 0;
      if (red.quieto % ENVIOS_POR_SEGUNDO === 0) { enviar(pos); red.ultimaPos = txt; }
    }
    // Los amigos se dibujan un poquito en el pasado, entre dos posiciones que ya llegaron (ver valoresEn en red.js)
    const ahora = performance.now(), giroAmigo = i => (i === 3 ? 'giro' : null);
    for (const f of red.otros.values()) {
      const o = f.obj;
      const v = valoresEn(f.suave, ahora, giroAmigo);
      if (v) {
        const vx = dt > 0 ? (v[0] - o.position.x) / dt : 0, vz = dt > 0 ? (v[2] - o.position.z) / dt : 0;
        o.position.set(v[0], v[1], v[2]);
        o.rotation.y = acercarAngulo(o.rotation.y, rumboDeMovimiento(vx, vz, v[3]), Math.min(1, dt * 10));   // 🧭 mira hacia donde camina (girando suave)
      }
      bendObj(o, dt);
    }
    // Pedacitos de la explosión: vuelan, caen, giran y se desvanecen
    for (let i = red.pedazos.length - 1; i >= 0; i--) {
      const boom = red.pedazos[i];
      boom.vida -= dt; boom.mat.opacity = Math.min(1, boom.vida);
      for (const q of boom.piezas) {
        q.vy -= 20 * dt;
        q.m.position.x += q.vx * dt; q.m.position.y += q.vy * dt; q.m.position.z += q.vz * dt;
        if (q.m.position.y < 0.12) { q.m.position.y = 0.12; q.vy *= -0.4; q.vx *= 0.7; q.vz *= 0.7; }   // rebota en el piso
        q.m.rotation.x += q.giro * dt; q.m.rotation.z += q.giro * dt;
      }
      if (boom.vida <= 0) { for (const q of boom.piezas) scene.remove(q.m); boom.mat.dispose(); red.pedazos.splice(i, 1); }
    }
  }

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  let t = 0;
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    t += dt;

    let fx = 0, fz = 0;
    if (keys.KeyW || keys.ArrowUp) fz -= 1;
    if (keys.KeyS || keys.ArrowDown) fz += 1;
    if (keys.KeyA) fx -= 1;
    if (keys.KeyD) fx += 1;
    // Flechas izquierda/derecha giran la cámara (más rápido que con el ratón)
    const CAM_TURN = 3;
    if (keys.ArrowLeft) camYaw += CAM_TURN * dt;
    if (keys.ArrowRight) camYaw -= CAM_TURN * dt;
    fx += joy.x; fz += joy.y;
    // Joystick de la cámara (celular): a los lados gira, arriba y abajo mira hacia arriba o abajo
    if (camJoy.x || camJoy.y) {
      camYaw -= camJoy.x * 2.6 * dt;
      if (firstPerson) fpPitch = Math.min(1.3, Math.max(-1.3, fpPitch - camJoy.y * 1.6 * dt));
      else camPitch = Math.min(1.2, Math.max(0.1, camPitch + camJoy.y * 1.2 * dt));
    }
    const busy = !loginEl.hidden || !!escondido;
    if (busy) fx = fz = 0; // eligiendo usuario (o metido en una caja) no te mueves
    const len = Math.hypot(fx, fz);
    let moving = false;
    if (len > 0.1) {
      moving = true;
      const n = Math.min(len, 1) / len;
      fx *= n; fz *= n;
      // relativo a la cámara
      const s = Math.sin(camYaw), c = Math.cos(camYaw);
      const mx = fx * c + fz * s, mz = -fx * s + fz * c;
      ps.walkX += mx * SPEED * dt;
      ps.walkZ += mz * SPEED * dt;
      turnTo(ps, mx, mz, dt);
    }

    // 🪜 En una escotilla: W o ESPACIO suben por la escalera, S baja. Si no tocas nada, resbalas despacito hacia abajo
    const esc = !escondido && escotillaEn(ps.pos.x, ps.pos.y, ps.pos.z);
    if (esc) {
      const sube = keys.KeyW || keys.ArrowUp || keys.Space || joy.y < -0.5, baja = keys.KeyS || keys.ArrowDown || joy.y > 0.5;
      if (sube || baja) {
        ps.vel.y = sube ? 5.5 : -5.5;
        // Colgado de la escalera no caminas hacia los lados (si no, W te sacaría de la escalera en vez de subirte).
        // Arriba del todo sí: así te bajas caminando al piso
        if (!ps.onGround && ps.pos.y < PISO_PRINCIPAL + 0.45) ps.walkX = ps.walkZ = 0;
        // Mientras trepas, te acomoda en el centro del hoyo (para no chocar la cabeza con el borde)
        const k = Math.min(1, dt * 5);
        ps.pos.x += ((esc.x0 + esc.x1) / 2 - ps.pos.x) * k; ps.pos.z += ((esc.z0 + esc.z1) / 2 - ps.pos.z) * k;
      } else ps.vel.y = Math.max(ps.vel.y, -6);
    }
    if (!escondido) physics(ps, dt, keys.Space && !busy && !esc);
    if (esc && ps.pos.y > PISO_PRINCIPAL + 0.5) { ps.pos.y = PISO_PRINCIPAL + 0.5; ps.vel.y = 0; }   // arriba de todo: te bajas caminando
    if (ps.pos.y < PISO_SUBSUELO - 15) { ps.pos.set(spawn.x, spawn.y, spawn.z); ps.vel.set(0, 0, 0); showToast('Te caíste del laboratorio: vuelves al spawn', true); }
    bendState(ps, dt);
    updateGuia(dt);
    updateRed(dt);
    updateEscondites(dt);

    // pequeño rebote al caminar
    body.position.y = H/2 + (moving && ps.onGround ? Math.abs(Math.sin(t * 12)) * 0.08 : 0);
    // La sombrita redonda debajo de ti (más chica mientras más alto saltas)
    const alturaSombra = ps.pos.y - (ps.floorY ?? ps.pos.y);
    sombra.visible = !escondido && ps.floorY > -1e8 && alturaSombra < 8;
    sombra.position.set(ps.pos.x, (ps.floorY ?? 0) + 0.02, ps.pos.z); sombra.scale.setScalar(Math.max(0.4, 1 - alturaSombra * 0.08));
    // El foco de Grey's Cove parpadea de vez en cuando
    focos.greyCove.intensity = Math.sin(t * 13) > 0.97 || Math.sin(t * 2.3) > 0.995 ? 0.15 : 0.9;

    const p = player.position;
    if (escondido) {
      // 📦 Dentro de la caja: miras desde adentro (por la rendija), y puedes girar para ver quién viene
      const ey = escondido.y + 0.95;
      camera.position.set(escondido.x, ey, escondido.z);
      camera.lookAt(escondido.x - Math.sin(camYaw) * Math.cos(fpPitch), ey + Math.sin(fpPitch), escondido.z - Math.cos(camYaw) * Math.cos(fpPitch));
    } else if (firstPerson) {
      // Primera persona: la cámara va en los ojos y mira hacia donde apunta la cámara
      const ey = p.y + body.position.y - H/2 + H*0.78;
      camera.position.set(p.x, ey, p.z);
      camera.lookAt(
        p.x - Math.sin(camYaw) * Math.cos(fpPitch),
        ey + Math.sin(fpPitch),
        p.z - Math.cos(camYaw) * Math.cos(fpPitch)
      );
    } else {
      // Cámara en tercera persona
      const head = new THREE.Vector3(p.x, p.y + 1.2, p.z);
      const back = new THREE.Vector3(Math.sin(camYaw) * Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw) * Math.cos(camPitch));
      // Si una pared (o el techo) queda en medio, la cámara se acerca enseguida; cuando ya no, se aleja suavemente
      camRay.set(head, back); camRay.far = 9;
      const choque = camRay.intersectObjects(bloqueanCamara, false)[0];
      const quiere = choque ? Math.max(0.6, choque.distance - 0.3) : 9;
      camDist = quiere < camDist ? quiere : camDist + (quiere - camDist) * Math.min(1, dt * 4);
      camera.position.copy(head).addScaledVector(back, camDist);
      camera.lookAt(head);
      player.visible = camDist > 1.3;   // si la cámara queda pegada a ti, te escondes para no tapar la vista
    }

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
